name: Backend Vitest

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-vitest.yml"
  push:
    paths:
      - "backend/**"
      - ".github/workflows/backend-vitest.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
